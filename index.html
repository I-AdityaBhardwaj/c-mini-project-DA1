<!DOCTYPE html>

<html>

<head>
<title>Mini Banking System</title>

<style>
body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
}

.container{
width:450px;
margin:auto;
background:white;
padding:20px;
margin-top:50px;
border-radius:10px;
box-shadow:0 0 10px gray;
}

button{
width:100%;
padding:12px;
margin:5px;
font-size:16px;
}

#output{
margin-top:20px;
background:black;
color:lime;
padding:10px;
height:200px;
overflow:auto;
text-align:left;
}
</style>

</head>

<body>

<div class="container">

<h2>Mini Banking System</h2>

<button onclick="createAcc()">Create Account</button> <button onclick="deposit()">Deposit</button> <button onclick="withdraw()">Withdraw</button> <button onclick="search()">Search Account</button> <button onclick="summary()">Account Summary</button> <button onclick="lastTx()">Last 5 Transactions</button>

<div id="output"></div>

</div>

<script>

var Module = {
print: function(text) {
document.getElementById("output").innerHTML += text + "<br>";
}
};

</script>

<script src="index.js"></script>

<script>

function createAcc(){

let acc = prompt("Account Number");
let name = prompt("Name");
let bal = prompt("Initial Balance");

Module.ccall(
'createAccount',
'number',
['number','string','number'],
[acc,name,bal]
);

document.getElementById("output").innerHTML += "Account Created<br>";
}

function deposit(){

let acc = prompt("Account Number");
let amt = prompt("Amount");

let result = Module.ccall(
'deposit',
'number',
['number','number'],
[acc,amt]
);

if(result==-1)
alert("Account not found");
else
document.getElementById("output").innerHTML += "New Balance: "+result+"<br>";
}

function withdraw(){

let acc = prompt("Account Number");
let amt = prompt("Amount");

let result = Module.ccall(
'withdraw',
'number',
['number','number'],
[acc,amt]
);

if(result==-1)
alert("Account not found");

else if(result==-2)
alert("Insufficient balance");

else
document.getElementById("output").innerHTML += "New Balance: "+result+"<br>";
}

function search(){

let acc = prompt("Account Number");

let result = Module.ccall(
'searchAccount',
'number',
['number'],
[acc]
);

if(result==-1)
alert("Account not found");
else
document.getElementById("output").innerHTML += "Balance: "+result+"<br>";
}

function summary(){
Module.ccall('accountSummary');
}

function lastTx(){

let acc = prompt("Account Number");

Module.ccall(
'lastTransactions',
null,
['number'],
[acc]
);
}

</script>

</body>
</html>
