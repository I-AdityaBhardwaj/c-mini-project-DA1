<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mini Banking System</title>

<style>

body{
    font-family: Arial;
    background:#121212;
    color:white;
    text-align:center;
}

h1{
    color:#4CAF50;
}

.container{
    width:700px;
    margin:auto;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    background:#4CAF50;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#45a049;
}

input{
    padding:10px;
    margin:10px;
    width:250px;
}

#output{
    margin-top:20px;
    height:300px;
    background:black;
    color:#00ff9c;
    padding:10px;
    overflow-y:auto;
    text-align:left;
    font-family:monospace;
    border:2px solid #444;
}

</style>
</head>

<body>

<h1>🏦 Mini Banking System</h1>

<div class="container">

<button onclick="sendCommand(1)">Create Account</button>
<button onclick="sendCommand(2)">Deposit</button>
<button onclick="sendCommand(3)">Withdraw</button>
<button onclick="sendCommand(4)">Search Account</button>
<button onclick="sendCommand(5)">View Transactions</button>

<br><br>

<input id="userInput" placeholder="Enter data here">
<button onclick="sendInput()">Submit</button>

<div id="output"></div>

</div>

<script>

let inputBuffer = "";

/* send command buttons */

function sendCommand(cmd){
    inputBuffer += cmd + "\n";
}

/* send textbox input */

function sendInput(){

    const box = document.getElementById("userInput");

    if(box.value.trim()==="") return;

    inputBuffer += box.value + "\n";

    box.value="";
    box.focus();
}

/* emscripten configuration */

var Module = {

print: function(text){
    const out = document.getElementById("output");
    if(out){
        out.textContent += text + "\n";
        out.scrollTop = out.scrollHeight;
    }
},

printErr: function(text){
    const out = document.getElementById("output");
    if(out){
        out.textContent += text + "\n";
    }
},

stdin: function(){

    if(inputBuffer.length === 0)
        return null;

    const ch = inputBuffer.charCodeAt(0);
    inputBuffer = inputBuffer.slice(1);

    return ch;
}

};

</script>

<!-- IMPORTANT: index.js must load AFTER Module -->
<script src="index.js"></script>

</body>
</html>
