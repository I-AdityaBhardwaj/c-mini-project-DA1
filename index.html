<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mini Banking System</title>

<style>

body{
    font-family: Arial;
    background:#121212;
    color:white;
    text-align:center;
}

h1{
    color:#4CAF50;
}

.container{
    width:600px;
    margin:auto;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    background:#4CAF50;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#45a049;
}

input{
    padding:8px;
    margin:5px;
    width:200px;
}

#output{
    margin-top:20px;
    height:250px;
    background:black;
    color:#00ff9c;
    padding:10px;
    overflow-y:auto;
    text-align:left;
    font-family:monospace;
}

</style>
</head>

<body>

<h1>🏦 Mini Banking System</h1>

<div class="container">

<button onclick="sendCommand(1)">Create Account</button>
<button onclick="sendCommand(2)">Deposit</button>
<button onclick="sendCommand(3)">Withdraw</button>
<button onclick="sendCommand(4)">Search Account</button>
<button onclick="sendCommand(5)">View Transactions</button>

<br><br>

<input id="userInput" placeholder="Enter data here">
<button onclick="sendInput()">Submit</button>

<div id="output"></div>

</div>

<script>

let queue = [];
let output = document.getElementById("output");
let inputBox = document.getElementById("userInput");

function print(text){
    output.innerText += text + "\n";
    output.scrollTop = output.scrollHeight;
}

function sendCommand(num){
    let cmd = num + "\n";

    print("> " + num);

    for(let i=0;i<cmd.length;i++)
        queue.push(cmd.charCodeAt(i));
}

function sendInput(){

    let val = inputBox.value + "\n";

    print("> " + inputBox.value);

    for(let i=0;i<val.length;i++)
        queue.push(val.charCodeAt(i));

    inputBox.value="";
}

inputBox.addEventListener("keypress",function(e){
    if(e.key==="Enter") sendInput();
});

var Module = {

print: function(text){
    print(text);
},

stdin: function(){

    if(queue.length>0)
        return queue.shift();

    return undefined;
}

};

</script>

<script async src="index.js"></script>

</body>
</html>
