<!DOCTYPE html>
<html>

<head>

<title>Mini Banking System</title>

<script src="bank.js"></script>

<style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
}

.container{
width:450px;
margin:auto;
background:white;
padding:20px;
margin-top:50px;
border-radius:10px;
box-shadow:0 0 10px gray;
}

button{
width:100%;
padding:12px;
margin:5px;
font-size:16px;
}

#output{
margin-top:20px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h2>Mini Banking System</h2>

<button onclick="createAcc()">Create Account</button>
<button onclick="deposit()">Deposit</button>
<button onclick="withdraw()">Withdraw</button>
<button onclick="search()">Search Account</button>
<button onclick="summary()">Account Summary</button>
<button onclick="lastTx()">Last 5 Transactions</button>

<div id="output"></div>

</div>

<script>

function createAcc(){

let accNo = prompt("Account Number");
let name = prompt("Name");
let balance = prompt("Initial Balance");

Module.ccall(
'createAccount',
'number',
['number','string','number'],
[accNo,name,balance]
);

document.getElementById("output").innerHTML="Account Created";

}

function deposit(){

let acc = prompt("Account Number");
let amount = prompt("Deposit Amount");

let result = Module.ccall(
'deposit',
'number',
['number','number'],
[acc,amount]
);

if(result==-1)
alert("Account Not Found");
else
document.getElementById("output").innerHTML="New Balance: "+result;

}

function withdraw(){

let acc = prompt("Account Number");
let amount = prompt("Withdraw Amount");

let result = Module.ccall(
'withdraw',
'number',
['number','number'],
[acc,amount]
);

if(result==-1)
alert("Account Not Found");

else if(result==-2)
alert("Insufficient Balance");

else
document.getElementById("output").innerHTML="New Balance: "+result;

}

function search(){

let acc = prompt("Account Number");

let result = Module.ccall(
'searchAccount',
'number',
['number'],
[acc]
);

if(result==-1)
alert("Account Not Found");
else
document.getElementById("output").innerHTML="Balance: "+result;

}

function summary(){

alert("Check browser console for account summary");

Module.ccall('accountSummary');

}

function lastTx(){

let acc = prompt("Account Number");

alert("Check browser console for transactions");

Module.ccall(
'lastTransactions',
null,
['number'],
[acc]
);

}

</script>

</body>

</html>
