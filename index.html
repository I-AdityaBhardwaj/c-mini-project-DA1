<!DOCTYPE html>

<html>

<head>

<title>Mini Banking System</title>

<style>

body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
}

.container{
width:500px;
margin:auto;
background:white;
padding:25px;
margin-top:50px;
border-radius:10px;
box-shadow:0 0 10px gray;
}

input{
width:90%;
padding:10px;
margin:5px;
font-size:15px;
}

button{
width:95%;
padding:12px;
margin:5px;
font-size:16px;
cursor:pointer;
}

#output{
margin-top:20px;
background:black;
color:lime;
padding:10px;
height:200px;
overflow:auto;
text-align:left;
}

</style>

</head>

<body>

<div class="container">

<h2>Mini Banking System</h2>

<input id="accNo" placeholder="Account Number">

<input id="name" placeholder="Name">

<input id="amount" placeholder="Amount">

<button onclick="createAcc()">Create Account</button>

<button onclick="deposit()">Deposit</button>

<button onclick="withdraw()">Withdraw</button>

<button onclick="search()">Search Account</button>

<button onclick="summary()">Account Summary</button>

<button onclick="lastTx()">Last 5 Transactions</button>

<div id="output"></div>

</div>

<script>

var Module = {
print: function(text) {
document.getElementById("output").innerHTML += text + "<br>";
}
};

</script>

<script src="index.js"></script>

<script>

function createAcc(){

let acc = document.getElementById("accNo").value;
let name = document.getElementById("name").value;
let bal = document.getElementById("amount").value;

Module.ccall(
'createAccount',
'number',
['number','string','number'],
[acc,name,bal]
);

document.getElementById("output").innerHTML += "Account Created<br>";

}

function deposit(){

let acc = document.getElementById("accNo").value;
let amt = document.getElementById("amount").value;

let result = Module.ccall(
'deposit',
'number',
['number','number'],
[acc,amt]
);

if(result==-1)
alert("Account not found");
else
document.getElementById("output").innerHTML += "New Balance: "+result+"<br>";

}

function withdraw(){

let acc = document.getElementById("accNo").value;
let amt = document.getElementById("amount").value;

let result = Module.ccall(
'withdraw',
'number',
['number','number'],
[acc,amt]
);

if(result==-1)
alert("Account not found");

else if(result==-2)
alert("Insufficient balance");

else
document.getElementById("output").innerHTML += "New Balance: "+result+"<br>";

}

function search(){

let acc = document.getElementById("accNo").value;

let result = Module.ccall(
'searchAccount',
'number',
['number'],
[acc]
);

if(result==-1)
alert("Account not found");
else
document.getElementById("output").innerHTML += "Balance: "+result+"<br>";

}

function summary(){

Module.ccall('accountSummary');

}

function lastTx(){

let acc = document.getElementById("accNo").value;

Module.ccall(
'lastTransactions',
null,
['number'],
[acc]
);

}

</script>

</body>
</html>
