<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mini Banking System</title>

<style>

body{
    background:#0d1117;
    color:#00ff9c;
    font-family: Consolas, monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin:0;
    padding:30px;
}

h1{
    color:#58a6ff;
    margin-bottom:20px;
}

#terminal{
    width:900px;
    height:450px;
    background:black;
    border:2px solid #30363d;
    border-radius:8px;
    padding:15px;
    overflow-y:auto;
    white-space:pre-wrap;
    font-size:14px;
}

.input-area{
    margin-top:15px;
    width:900px;
    display:flex;
}

#userInput{
    flex:1;
    padding:12px;
    background:#161b22;
    border:1px solid #30363d;
    color:white;
    border-radius:5px;
    outline:none;
}

button{
    padding:12px 20px;
    margin-left:10px;
    background:#238636;
    border:none;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#2ea043;
}

.status{
    margin-top:10px;
    font-size:13px;
    color:#8b949e;
}

</style>
</head>

<body>

<h1>🏦 Mini Banking System</h1>

<div id="terminal"></div>

<div class="input-area">
<input id="userInput" placeholder="Type input here and press Enter..." autofocus>
<button onclick="sendInput()">Send</button>
</div>

<div class="status" id="status">Loading WebAssembly...</div>

<script>

var terminal = document.getElementById("terminal");
var inputField = document.getElementById("userInput");
var status = document.getElementById("status");

var inputQueue = [];


/* PRINT OUTPUT FROM C */
function printToTerminal(text){
    terminal.innerText += text + "\n";
    terminal.scrollTop = terminal.scrollHeight;
}


/* SEND INPUT TO C PROGRAM */
function sendInput(){

    var val = inputField.value;

    if(val === "") return;

    printToTerminal("> " + val);

    var str = val + "\n";

    for(let i=0;i<str.length;i++){
        inputQueue.push(str.charCodeAt(i));
    }

    inputField.value="";
}


inputField.addEventListener("keypress",function(e){
    if(e.key==="Enter"){
        sendInput();
    }
});


/* EMSCRIPTEN MODULE */

var Module = {

preRun: [],
postRun: [],

print: function(text){
    printToTerminal(text);
},

stdin: function(){

    if(inputQueue.length>0){
        return inputQueue.shift();
    }

    return undefined;   // IMPORTANT (prevents infinite loop)
},

onRuntimeInitialized: function(){
    status.innerText="Program Ready";
}

};

</script>

<script async src="index.js"></script>

</body>
</html>
