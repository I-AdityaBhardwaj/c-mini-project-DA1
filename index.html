<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mini Banking System</title>

<style>
body{
    font-family: monospace;
    background:#111;
    color:#00ff9c;
    text-align:center;
}

h1{
    color:#4CAF50;
}

#terminal{
    width:800px;
    height:400px;
    margin:auto;
    background:black;
    border:2px solid #444;
    overflow-y:auto;
    padding:10px;
    text-align:left;
    white-space:pre-wrap;
}

#inputBox{
    width:600px;
    padding:10px;
    margin-top:10px;
}

button{
    padding:10px 20px;
    background:#4CAF50;
    color:white;
    border:none;
}
</style>
</head>

<body>

<h1>Mini Banking System</h1>

<div id="terminal"></div>

<br>

<input id="inputBox" placeholder="Enter input here">
<button onclick="sendInput()">Send</button>

<script>

let inputQueue = [];
let terminal = document.getElementById("terminal");
let inputBox = document.getElementById("inputBox");

function sendInput(){
    let value = inputBox.value + "\n";

    terminal.innerText += "> " + value;

    for(let i=0;i<value.length;i++){
        inputQueue.push(value.charCodeAt(i));
    }

    inputBox.value="";
}

inputBox.addEventListener("keypress",function(e){
    if(e.key==="Enter"){
        sendInput();
    }
});

var Module = {

print:function(text){
    terminal.innerText += text + "\n";
    terminal.scrollTop = terminal.scrollHeight;
},

stdin:function(){
    if(inputQueue.length>0){
        return inputQueue.shift();
    }
    return undefined;
}

};

</script>

<script async src="index.js"></script>

</body>
</html>
