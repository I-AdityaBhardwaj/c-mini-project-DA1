<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mini Banking System</title>

<style>

body{
    font-family: Arial;
    background:#121212;
    color:white;
    text-align:center;
}

h1{
    color:#4CAF50;
}

.container{
    width:700px;
    margin:auto;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    background:#4CAF50;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#45a049;
}

#output{
    margin-top:20px;
    height:350px;
    background:black;
    color:#00ff9c;
    padding:10px;
    overflow-y:auto;
    text-align:left;
    font-family:monospace;
    border:2px solid #444;
}

</style>
</head>

<body>

<h1>🏦 Mini Banking System</h1>

<div class="container">

<button onclick="startProgram()">Start Banking System</button>

<div id="output"></div>

</div>

<script>

var Module = {

print: function(text){
    var out=document.getElementById("output");
    out.textContent += text + "\n";
    out.scrollTop = out.scrollHeight;
},

printErr: function(text){
    var out=document.getElementById("output");
    out.textContent += text + "\n";
}

};

function startProgram(){
    document.getElementById("output").textContent="";
}

</script>

<script src="index.js"></script>

</body>
</html>
