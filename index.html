<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Mini Banking System - Live</title>
    <style>
      body {
        font-family: arial;
        margin: 0;
        padding: 20px;
        background-color: #1a1a1a;
        color: #eee;
        text-align: center;
      }

      /* CUSTOM INPUT AREA STYLING */
      .input-area { 
        background: #333; 
        padding: 20px; 
        border-radius: 8px; 
        display: inline-block; 
        margin-bottom: 20px;
        border: 1px solid #444;
      }
      input#userInput { 
        padding: 12px; 
        width: 300px; 
        border: none; 
        border-radius: 4px; 
        font-size: 16px;
      }
      button#sendBtn { 
        padding: 12px 25px; 
        background: #27ae60; 
        color: white; 
        border: none; 
        border-radius: 4px; 
        cursor: pointer; 
        font-weight: bold; 
        font-size: 16px;
        margin-left: 10px;
      }
      button#sendBtn:hover { background: #2ecc71; }

      /* TERMINAL OUTPUT STYLING */
      #output {
        width: 90%;
        height: 450px;
        margin: 0 auto;
        display: block;
        background-color: black;
        color: #33ff33; /* Classic terminal green */
        font-family: 'Lucida Console', Monaco, monospace;
        padding: 15px;
        border: 2px solid #444;
        border-radius: 5px;
        outline: none;
        resize: none;
      }

      .emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
      #status { font-weight: bold; color: #888; margin-bottom: 10px; }
      canvas { display: none; } /* We don't need the graphics canvas for a terminal project */
    </style>
  </head>
  <body>
    
    <h1>🏦 Mini Banking System</h1>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type menu option or data here..." autofocus>
        <button id="sendBtn" onclick="sendCommand()">Send Input</button>
    </div>

    <div class="emscripten" id="status">Loading System...</div>

    <textarea id="output" readonly></textarea>
    
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script type='text/javascript'>
      var statusElement = document.getElementById('status');
      var outputElement = document.getElementById('output');
      var userInput = document.getElementById('userInput');
      
      // STEP 3: The Input Bridge Logic
      var inputQueue = []; 

      function sendCommand() {
          if (!userInput.value) return;
          
          // Show what the user typed in the terminal so it looks natural
          outputElement.value += "> " + userInput.value + "\n";
          
          // Convert text to character codes for the C program
          var val = userInput.value + "\n"; 
          for (var i = 0; i < val.length; i++) {
              inputQueue.push(val.charCodeAt(i));
          }
          userInput.value = ""; // Clear input box
          outputElement.scrollTop = outputElement.scrollHeight;
      }

      // Allow pressing "Enter" key to send
      userInput.addEventListener('keypress', function (e) {
          if (e.key === 'Enter') sendCommand();
      });

      var Module = {
        print: function(text) {
          if (outputElement) {
            outputElement.value += text + "\n";
            outputElement.scrollTop = outputElement.scrollHeight;
          }
        },
        // STEP 4: Tell C to look at our Input Queue instead of opening Pop-ups
        stdin: function() {
          if (inputQueue.length > 0) {
            return inputQueue.shift();
          }
          return null; 
        },
        canvas: document.getElementById('canvas'),
        setStatus: function(text) {
          if (statusElement) statusElement.innerHTML = text;
        }
      };
    </script>
    <script async type="text/javascript" src="index.js"></script>
  </body>
</html>
