<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mini Banking System</title>

<style>

body{
    font-family: Arial;
    background:#121212;
    color:white;
    text-align:center;
}

h1{
    color:#4CAF50;
}

.container{
    width:700px;
    margin:auto;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    background:#4CAF50;
    color:white;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    background:#45a049;
}

input{
    padding:10px;
    margin:10px;
    width:250px;
    font-size:16px;
}

#output{
    margin-top:20px;
    height:300px;
    background:black;
    color:#00ff9c;
    padding:10px;
    overflow-y:auto;
    text-align:left;
    font-family:monospace;
    border:2px solid #444;
}

</style>
</head>

<body>

<h1>🏦 Mini Banking System</h1>

<div class="container">

<button onclick="sendCommand(1)">Create Account</button>
<button onclick="sendCommand(2)">Deposit</button>
<button onclick="sendCommand(3)">Withdraw</button>
<button onclick="sendCommand(4)">Search Account</button>
<button onclick="sendCommand(5)">View Transactions</button>

<br><br>

<input id="userInput" placeholder="Enter data here" autofocus>
<button onclick="sendInput()">Submit</button>

<div id="output"></div>

</div>

<script>

/* INPUT QUEUE FOR C PROGRAM */

var inputQueue = [];


/* PUSH USER INPUT TO C PROGRAM */

function pushInput(str){

    str = str + "\n";

    for(let i=0;i<str.length;i++){
        inputQueue.push(str.charCodeAt(i));
    }
}


/* BUTTON COMMANDS */

function sendCommand(cmd){

    print("> " + cmd);

    pushInput(cmd);

    document.getElementById("userInput").focus();
}


/* USER INPUT */

function sendInput(){

    const box = document.getElementById("userInput");
    const value = box.value;

    if(value.trim()==="") return;

    print("> " + value);

    pushInput(value);

    box.value="";
    box.focus();
}


/* ENTER KEY SUPPORT */

document.getElementById("userInput").addEventListener("keypress",function(e){

    if(e.key==="Enter"){
        sendInput();
    }

});


/* OUTPUT TERMINAL */

function print(text){

    const out=document.getElementById("output");

    out.textContent += text + "\n";

    out.scrollTop = out.scrollHeight;
}


/* EMSCRIPTEN OVERRIDE */

var Module = {

stdin: function(){

    if(inputQueue.length>0){
        return inputQueue.shift();
    }

    return null;
},

print: function(text){
    print(text);
}

};


/* AUTO FOCUS */

window.onload=function(){
    document.getElementById("userInput").focus();
};

</script>


<script async src="index.js"></script>

</body>
</html>
